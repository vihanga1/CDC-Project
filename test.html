<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      .image-scroll {
        transition: transform 0.2s ease-out; /* Smooths the movement */
        display: block;
        width: 100%;
        height: auto;
      }

      .container {
        overflow: hidden; /* Prevents the image from overlapping other content when scaling */
        width: 600px;
        margin: 0 auto;
      }
      .row {
        width: 100%;
        height: 400px;
        background-color: yellow;
      }
    </style>
  </head>
  <body>
    <div class="row"></div>
    <div class="row"></div>
    <div class="container">
      <img src="assets/img/card-1-img-1.jpg" class="image-scroll" alt="" />
    </div>
    <div class="row"></div>
    <div class="row"></div>
    <div class="row"></div>
    <div class="row"></div>
    <script>
      /**
       * Targets elements by class and scales them based on scroll direction.
       * @param {string} className - The class name to target (e.g., 'image-scroll').
       * @param {number} sensitivity - How fast the image scales (default 0.001).
       */
      function setupHorizontalScroll(className, range = 15) {
        const images = document.querySelectorAll(`.${className}`);
        let posX = 0;

        window.addEventListener(
          "wheel",
          (event) => {
            // Adjust the multiplier (0.05) to make the movement
            // feel more or less sensitive to the finger/wheel.
            posX += event.deltaY * 0.05;

            // Clamp the movement so it never exceeds the range
            // This ensures it only moves "a few pixels"
            posX = Math.min(Math.max(-range, posX), range);

            images.forEach((img) => {
              img.style.transform = `translateX(${posX}px)`;
            });
          },
          { passive: true },
        );
      }

      // Initialize the function
      setupHorizontalScroll("image-scroll");
    </script>
  </body>
</html>
